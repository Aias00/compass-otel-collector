version: "2.4"

services:
  otel-collector:
    image: signoz/signoz-otel-collector:${OTELCOL_TAG:-0.79.1}
    command: ["--config=/etc/otel-collector-config.yaml", "--feature-gates=-pkg.translator.prometheus.NormalizeName"]
    user: root
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - /home/git/compass-web-org/log:/tmp/compass/compass-web-org
      - /home/git/compass-web-service/log:/tmp/compass/compass-web-service
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - DOCKER_MULTI_NODE_CLUSTER=false
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    ports:
      # Keep unauthenticated OTLP receivers local by default. Set OTEL_BIND_HOST
      # explicitly when a protected network endpoint is required.
      - "${OTEL_BIND_HOST:-127.0.0.1}:4317:4317"     # OTLP gRPC receiver
      - "${OTEL_BIND_HOST:-127.0.0.1}:4318:4318"     # OTLP HTTP receiver
    restart: on-failure
